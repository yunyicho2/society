# Cloudflare Pages 프로젝트 설정 (docs/DEPLOY.md 참고)
name = "hdhs-office"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SHEET_ID = "1TPqt6-glrLf1QsqvDh_p_s_9V_aBkFZOcmBr9On0bBs"
SCHOOL_NAME = "현대고등학교"
NEIS_ATPT = "H10"
# NEIS_SCHOOL_CODE = ""       # 7자리 표준학교코드를 알면 넣기 (비우면 학교 이름으로 자동 조회)
WEATHER_LAT = "35.5275"
WEATHER_LON = "129.4280"
AI_DAILY_LIMIT = "60"
# 아래 두 값은 Zero Trust 대시보드에서 확인 후 채우기
ACCESS_TEAM_DOMAIN = "hdhs.cloudflareaccess.com"
ACCESS_AUD = ""
# '그 외 자료' 폴더 ID (드라이브 주소 .../folders/<이 부분>)
DRIVE_FOLDER_ID = ""

# 비밀 값은 여기 쓰지 말고 `wrangler pages secret put` 으로 넣기:
#   GOOGLE_SA_EMAIL, GOOGLE_SA_KEY, ANTHROPIC_API_KEY, NEIS_API_KEY(선택)

[[d1_databases]]
binding = "DB"
database_name = "hdhs-office"
database_id = "00000000-0000-0000-0000-000000000000"   # `wrangler d1 create hdhs-office` 결과로 바꾸기
migrations_dir = "migrations"

[[vectorize]]
binding = "VEC"
index_name = "hdhs-rules"

[ai]
binding = "AI"
